<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients · CRM</title><link rel="stylesheet" href="/app/css/style.css"></head>
<body><div class="page-shell"><div class="app-layout">
<aside class="sidebar"><div class="brand"><div class="brand-mark">CR</div><div><div class="brand-name">CRM</div><div class="brand-sub">Workspace</div></div></div><div class="nav-group"><div class="nav-label">Workspace</div><nav class="nav"><a data-nav href="dashboard.html">⌂ Overview</a><a data-nav href="clients.html">◌ Clients</a><a data-nav href="tasks.html">▤ Tasks</a><a data-admin-only data-nav href="admin.html" hidden>◇ Admin</a></nav></div><div class="sidebar-footer"><div class="user-mini"><div class="avatar" data-avatar>U</div><div><div data-user-name>—</div><div class="muted small" data-user-email>—</div></div></div><button class="btn btn-ghost btn-full" data-logout>Sign out</button></div></aside>
<nav class="mobile-nav"><a data-nav href="dashboard.html">Overview</a><a data-nav href="clients.html">Clients</a><a data-nav href="tasks.html">Tasks</a><a data-admin-only data-nav href="admin.html" hidden>Admin</a><button class="btn btn-sm" data-logout>Sign out</button></nav>
<main class="main-content"><div class="topbar"><div><div class="page-title">Clients</div><div class="page-meta">Your working relationships, without the noise.</div></div><span class="badge" data-role>—</span></div><div class="content">
<div class="section-head"><div><div class="eyebrow">Client desk</div><h1>People worth remembering.</h1><p class="lede">Search, sort, and open any client you own.</p></div><button id="openCreate" class="btn btn-primary">+ New client</button></div>
<div class="toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="input" placeholder="Search by name…"></div><select id="sort" style="width:180px"><option value="created_at">Created</option><option value="name">Name</option></select><select id="order" style="width:160px"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select></div>
<div class="card flush"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>ID</th><th></th></tr></thead><tbody id="clientRows"></tbody></table></div></div>
<div class="pagination"><div id="paginationInfo" class="pagination-info">—</div><button id="prevPage" class="btn btn-sm">←</button><button id="nextPage" class="btn btn-sm">→</button></div>
</div></main></div></div>
<dialog id="createDialog" style="width:min(520px,calc(100vw - 30px));background:#111318;color:#f3f1ea;border:1px solid #2a2e36;border-radius:16px;padding:24px"><div class="card-title"><h2>New client</h2><button id="closeCreate" class="btn btn-sm">Close</button></div><form id="clientForm" class="grid"><div class="field"><label class="label">Name</label><input class="input" name="name" required></div><div class="field"><label class="label">Phone</label><input class="input" name="phone" required></div><div class="field"><label class="label">Email <span class="muted">(optional)</span></label><input class="input" name="email" type="email"></div><button class="btn btn-primary">Create client</button></form></dialog>
<div id="toastStack" class="toast-stack"></div><script type="module" src="/app/js/clients.js"></script></body></html>
