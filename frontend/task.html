<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task · CRM</title><link rel="stylesheet" href="/app/css/style.css"></head>
<body><div class="app-layout">
<aside class="sidebar"><div class="brand"><div class="brand-mark">CR</div><div><div class="brand-name">CRM</div><div class="brand-sub">Workspace</div></div></div><nav class="nav"><a data-nav href="dashboard.html">⌂ Overview</a><a data-nav href="clients.html">◌ Clients</a><a data-nav href="tasks.html">▤ Tasks</a><a data-admin-only data-nav href="admin.html" hidden>◇ Admin</a></nav><div class="sidebar-footer"><div class="user-mini"><div class="avatar" data-avatar>U</div><div><div data-user-name>—</div><div class="muted small" data-user-email>—</div></div></div><button class="btn btn-ghost btn-full" data-logout>Sign out</button></div></aside>
<nav class="mobile-nav"><a data-nav href="dashboard.html">Overview</a><a data-nav href="clients.html">Clients</a><a data-nav href="tasks.html">Tasks</a><a data-admin-only href="admin.html" hidden>Admin</a><button class="btn btn-sm" data-logout>Sign out</button></nav>
<main class="main-content"><div class="topbar"><div><div class="page-title">Task record</div><div id="taskMeta" class="page-meta">Loading…</div></div><span class="badge" data-role>—</span></div><div class="content">
<div class="section-head"><div><div class="eyebrow">Action item</div><h1 id="taskTitle">Loading…</h1></div><a class="btn" href="tasks.html">← Back</a></div>
<div class="detail-grid"><section class="card"><div class="card-title"><h2>Task details</h2><span id="statusView"></span></div><form id="editForm" class="grid"><div class="field"><label class="label">Title</label><input id="title" class="input" required></div><div class="field"><label class="label">Description</label><textarea id="description" required></textarea></div><div class="grid grid-2"><div class="field"><label class="label">Status</label><select id="status"><option value="new">New</option><option value="in_progress">In progress</option><option value="done">Done</option></select></div><div class="field"><label class="label">Deadline</label><input id="deadline" class="input" type="datetime-local"></div></div><div class="row-actions"><button class="btn btn-primary">Save changes</button><button id="deleteTask" type="button" class="btn btn-danger">Delete task</button></div></form></section>
<section class="card"><div class="card-title"><h2>Context</h2></div><div class="meta-list"><div class="meta-row"><div class="meta-key">Manager</div><div id="manager" class="meta-value">—</div></div><div class="meta-row"><div class="meta-key">Client</div><div id="client" class="meta-value">—</div></div><div class="meta-row"><div class="meta-key">Created</div><div id="created" class="meta-value">—</div></div></div></section></div>
<section class="card" style="margin-top:16px"><div class="card-title"><h2>Conversation</h2><span class="muted small">Comments live under this task</span></div><div id="comments" class="comment-list"></div><form id="commentForm" class="grid" style="margin-top:16px"><textarea id="commentText" placeholder="Write a comment…" required></textarea><button class="btn">Add comment</button></form></section>
</div></main></div><script type="module" src="/app/js/task.js"></script></body></html>
