<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks · CRM</title><link rel="stylesheet" href="/app/css/style.css"></head>
<body><div class="app-layout">
<aside class="sidebar"><div class="brand"><div class="brand-mark">CR</div><div><div class="brand-name">CRM</div><div class="brand-sub">Workspace</div></div></div><nav class="nav"><a data-nav href="dashboard.html">⌂ Overview</a><a data-nav href="clients.html">◌ Clients</a><a data-nav href="tasks.html">▤ Tasks</a><a data-admin-only data-nav href="admin.html" hidden>◇ Admin</a></nav><div class="sidebar-footer"><div class="user-mini"><div class="avatar" data-avatar>U</div><div><div data-user-name>—</div><div class="muted small" data-user-email>—</div></div></div><button class="btn btn-ghost btn-full" data-logout>Sign out</button></div></aside>
<nav class="mobile-nav"><a data-nav href="dashboard.html">Overview</a><a data-nav href="clients.html">Clients</a><a data-nav href="tasks.html">Tasks</a><a data-admin-only data-nav href="admin.html" hidden>Admin</a><button class="btn btn-sm" data-logout>Sign out</button></nav>
<main class="main-content"><div class="topbar"><div><div class="page-title">Tasks</div><div class="page-meta">A clean queue of what moves the client relationship forward.</div></div><span class="badge" data-role>—</span></div><div class="content">
<div class="section-head"><div><div class="eyebrow">Task board</div><h1>Next moves, in order.</h1></div><button id="openCreate" class="btn btn-primary">+ New task</button></div>
<div class="toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="input" placeholder="Search title or description…"></div><select id="status" style="width:170px"><option value="">All statuses</option><option value="new">New</option><option value="in_progress">In progress</option><option value="done">Done</option></select><select id="sort" style="width:170px"><option value="created_at">Created</option><option value="deadline">Deadline</option><option value="title">Title</option></select><select id="order" style="width:150px"><option value="desc">Descending</option><option value="asc">Ascending</option></select></div>
<div class="card flush"><div class="table-wrap"><table><thead><tr><th>Task</th><th>Client</th><th>Status</th><th>Deadline</th><th>ID</th><th></th></tr></thead><tbody id="taskRows"></tbody></table></div></div><div class="pagination"><div id="paginationInfo" class="pagination-info">—</div><button id="prevPage" class="btn btn-sm">←</button><button id="nextPage" class="btn btn-sm">→</button></div>
</div></main></div>
<dialog id="createDialog" style="width:min(640px,calc(100vw - 30px));background:#111318;color:#f3f1ea;border:1px solid #2a2e36;border-radius:16px;padding:24px"><div class="card-title"><h2>New task</h2><button id="closeCreate" class="btn btn-sm">Close</button></div><form id="taskForm" class="grid"><div class="grid grid-2"><div class="field"><label class="label">Client</label><select id="client_id" name="client_id" required></select></div><div class="field"><label class="label">Status</label><select name="status" required><option value="new">New</option><option value="in_progress">In progress</option><option value="done">Done</option></select></div></div><div class="field"><label class="label">Title</label><input class="input" name="title" required></div><div class="field"><label class="label">Description</label><textarea name="description" required></textarea></div><div class="field"><label class="label">Deadline</label><input class="input" name="deadline" type="datetime-local" required></div><button class="btn btn-primary">Create task</button></form></dialog>
<div id="toastStack" class="toast-stack"></div><script type="module" src="/app/js/tasks.js"></script></body></html>
