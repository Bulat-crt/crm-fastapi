<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · CRM</title><link rel="stylesheet" href="/app/css/style.css"></head>
<body><div class="app-layout">
<aside class="sidebar"><div class="brand"><div class="brand-mark">CR</div><div><div class="brand-name">CRM</div><div class="brand-sub">Admin console</div></div></div><nav class="nav"><a href="dashboard.html">⌂ Overview</a><a href="clients.html">◌ Clients</a><a href="tasks.html">▤ Tasks</a><a data-nav href="admin.html">◇ Admin</a></nav><div class="sidebar-footer"><div class="user-mini"><div class="avatar" data-avatar>U</div><div><div data-user-name>—</div><div class="muted small" data-user-email>—</div></div></div><button class="btn btn-ghost btn-full" data-logout>Sign out</button></div></aside>
<nav class="mobile-nav"><a href="dashboard.html">Overview</a><a href="clients.html">Clients</a><a href="tasks.html">Tasks</a><a class="active" href="admin.html">Admin</a><button class="btn btn-sm" data-logout>Sign out</button></nav>
<main class="main-content"><div class="topbar"><div><div class="page-title">Admin console</div><div class="page-meta">The high-level view: people, clients, tasks.</div></div><span class="badge badge-admin">admin</span></div><div class="content">
<div class="section-head"><div><div class="eyebrow">Control room</div><h1 id="adminSectionTitle">Users</h1></div><div class="row-actions"><button class="btn btn-sm active" data-admin-section="users">Users</button><button class="btn btn-sm" data-admin-section="clients">Clients</button><button class="btn btn-sm" data-admin-section="tasks">Tasks</button></div></div>
<div class="card flush"><div class="table-wrap"><table><thead id="adminHead"></thead><tbody id="adminRows"></tbody></table></div></div><div class="pagination"><div id="paginationInfo" class="pagination-info">—</div><button id="prevPage" class="btn btn-sm">←</button><button id="nextPage" class="btn btn-sm">→</button></div>
<section class="grid grid-2" style="margin-top:24px"><div class="card"><div class="card-title"><h2>Manager task drill-down</h2></div><div class="grid"><div class="field"><label class="label">Manager ID</label><input id="managerId" class="input" type="number" min="1" placeholder="e.g. 3"></div><div class="grid grid-2"><div class="field"><label class="label">Page</label><input id="managerTaskPage" class="input" type="number" value="1" min="1"></div><div class="field"><label class="label">Limit</label><input id="managerTaskLimit" class="input" type="number" value="10" min="1" max="100"></div></div><button id="loadManagerTasks" class="btn btn-primary">Load manager tasks</button></div></div><div id="managerTaskOutput"><div class="empty">Pick a manager ID to inspect their task queue.</div></div></section>
</div></main></div><div id="toastStack" class="toast-stack"></div><script type="module" src="/app/js/admin.js"></script></body></html>
